<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
	<link rel="stylesheet" href="dashboard.css">
    <title>Dashboard - StudyPilot</title>
</head>

<body>
    <div class="parent-ctn flex">
        <aside class="sidebar flex column">
            <h2>StudyPilot</h2>

            <div class="profile flex">
                <div class="profile-img-ctn">
                    <img id="profile-image" src="" alt="">
                </div>

                <div class="user-info flex column">
                    <span id="username">John Doe</span>
                    <span id="department">Computer Science</span>
                </div>
            </div>

            <div class="nav flex column">
                    <a href="dashboard.html">
                        <div class="nav-item flex active">
                            <span class="nav-indicator"></span>
                            <img class="home icon" src="icons/home.png" alt="">
                            <span>Dashboard</span>
                        </div>
                    </a>

                    <a href="upload.html">
                        <div class="nav-item flex">
                            <img class="upload icon" src="icons/upload.png" alt="">
                            <span>Upload Syllabus</span>
                        </div>
                    </a>

                    <a href="study-planner.html">
                        <div class="nav-item flex">
                            <img class="calendar-w icon" src="icons/calendar-w.png" alt="">
                            <span>Study Planner</span>
                        </div>
                    </a>

                    <a href="progress.html">
                        <div class="nav-item flex">
                            <img class="bars icon" src="icons/progress.png" alt="">
                            <span>Progress</span>
                        </div>
                    </a>

                    <a href="" class="logout-ctn">
                        <div class="nav-item flex">
                            <img class="logout icon" src="icons/logout.png" alt="">
                            <span id="logout-btn">Logout</span>
                        </div>
                    </a>
            </div>
        </aside>

        <div class="main flex column">
            <div class="toprow flex">
                <div class="quick-stats container flex column">
                    <h3>Quick Stats</h3>

                    <div class="stats-ctn flex column">
                        <div class="stats flex column">
                            <div class="top flex">
                                <span>Courses</span>
                                <span id="courses-num">3</span>
                            </div>
                        
                            <div class="bar-ctn">
                                <div class="stats-bar" data-fraction="100%"></div>
                            </div>
                        </div>
                        <div class="stats flex column">
                            <div class="top flex">
                                <span>Current Streak</span>
                                <span id="current-streak">5 days</span>
                            </div>
                        
                            <div class="bar-ctn">
                                <div class="stats-bar" data-fraction="50%"></div>
                            </div>
                        </div>
                        <div class="stats flex column">
                            <div class="top flex">
                                <span>Longest Streak</span>
                                <span id="longest-streak">7 days</span>
                            </div>
                        
                            <div class="bar-ctn">
                                <div class="stats-bar" data-fraction="70%"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="time-spent container">
                    <h3>Time Spent Studying</h3>
                    <div id="time-spent-chart-ctn"></div>
                </div>
            </div>

            <div class="bottom-row flex">
                <div class="top-courses flex column container">
                    <h3>Top Courses</h3>

                    <div class="top-courses-ctn flex">
                        <div class="top-course flex column card">
                            <div class="course-bar-ctn">
                                <div class="course-bar"></div>
                            </div>
                        </div>

                        <div class="top-course flex column card">                            
                            <div class="course-bar-ctn">
                                <div class="course-bar"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="reminders flex column container">
                    <h3>Reminders</h3>
                    
                    <div class="reminders-ctn flex column">
                        <div class="rem flex card">
                            <img src="icons/bell.png" class="bell icon" alt="">
                            <div class="reminder-info flex column">
                                <span class="course-name top">CSC 211</span>
                                <span class="desc">Almost Time</span>
                            </div>
                            <span class="reminder-time">In <span id="time">57 minutes</span></span>
                        </div>

                        <div class="rem flex card">
                            <img src="icons/bell.png" class="bell icon" alt="">
                            <div class="reminder-info flex column">
                                <span class="course-name top">CSC 213</span>
                                <span class="desc">Close</span>
                            </div>
                            <span class="reminder-time">In <span id="time">1 hours</span></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
