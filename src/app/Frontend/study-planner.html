<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="study-planner.css">
    <title>Study Planner - StudyPilot</title>
</head>

<body>
    <div class="parent-ctn flex">
        <aside class="sidebar flex column">
            <h2>StudyPilot</h2>

            <div class="profile flex">
                <div class="profile-img-ctn">
                    <img id="profile-image" src="" alt="">
                </div>

                <div class="user-info flex column">
                    <span id="username">John Doe</span>
                    <span id="department">Computer Science</span>
                </div>
            </div>

            <div class="nav flex column">
                    <a href="dashboard.html">
                        <div class="nav-item flex">
                            <img class="home icon" src="icons/home.png" alt="">
                            <span>Dashboard</span>
                        </div>
                    </a>

                    <a href="upload.html">
                        <div class="nav-item flex">
                            <img class="upload icon" src="icons/upload.png" alt="">
                            <span>Upload Syllabus</span>
                        </div>
                    </a>

                    <a href="study-planner.html">
                        <div class="nav-item flex active">
                            <span class="nav-indicator"></span>
                            <img class="calendar-w icon" src="icons/calendar-w.png" alt="">
                            <span>Study Planner</span>
                        </div>
                    </a>

                    <a href="progress.html">
                        <div class="nav-item flex">
                            <img class="bars icon" src="icons/progress.png" alt="">
                            <span>Progress</span>
                        </div>
                    </a>

                    <a href="" class="logout-ctn">
                        <div class="nav-item flex">
                            <img class="logout icon" src="icons/logout.png" alt="">
                            <span id="logout-btn">Logout</span>
                        </div>
                    </a>
            </div>
        </aside>

        <div class="main">
            <form class="content container flex column shadow">
                <div class="top-row flex">
                    <div class="time-period-ctn flex column card">
                        <div class="hdr flex">
                            <img class="calendar icon" src="icons/calendar.png" alt="">
                            <h3>Time Period</h3>
                        </div>
          
                        <label for="start-date">Start Date</label>
                        <input class="input" type="date" id="start-date">
                        
                        <label for="end-date">End Date (Exam)</label>
                        <input class="input" type="date" id="end-date">
                    </div>
                    
                    <div class="study-preferences flex column card">
                        <div class="hdr flex">
                            <img class="clock icon" src="icons/clock.png" alt="">
                            <h3>Study Preferences</h3>
                        </div>
                       
                        <label for="hours">Hours Per Day</label>
                        <select class="input">
                                <option value="">Select hours</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                                <option value="7">7</option>
                                <option value="8">8</option>
                        </select>                       
                        
                        <label for="time">Preferred Time</label>
                        <select class="input">
                                <option value="">Select time</option>
                                <option value="0">00:00</option>
                                <option value="1">01:00</option>
                                <option value="2">02:00</option>
                                <option value="3">03:00</option>
                                <option value="4">04:00</option>
                                <option value="5">05:00</option>
                                <option value="6">06:00</option>
                                <option value="7">07:00</option>
                                <option value="8">08:00</option>
                                <option value="9">09:00</option>
                                <option value="10">10:00</option>
                                <option value="11">11:00</option>
                                <option value="12">12:00</option>
                                <option value="13">13:00</option>
                                <option value="14">14:00</option>
                                <option value="15">15:00</option>
                                <option value="16">16:00</option>
                                <option value="17">17:00</option>
                                <option value="18">18:00</option>
                                <option value="19">19:00</option>
                                <option value="20">20:00</option>
                                <option value="21">21:00</option>
                                <option value="22">22:00</option>
                                <option value="23">23:00</option>
                        </select>
                    </div>
                </div>

                <div class="course-selection flex column card">
                    <div class="hdr flex">
                        <img class="book icon" src="icons/book.png" alt="">
                        <h3>Course Selection</h3>
                    </div>

                    <div class="courses-grp flex">
                        <label>
                            <input type="checkbox">
                            <span class="course">CSC 211 - Data Structures</span>
                        </label>
                        <label>
                            <input type="checkbox">
                            <span class="course">CSC 213 - Algorithms</span>
                        </label>
                        <label>
                            <input type="checkbox">
                            <span class="course">CSC 212 - Database Systems</span>
                        </label>
                    </div>

                    <button type="submit" id="generate-btn">Generate Study Plan</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
