<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
	<link rel="stylesheet" href="progress.css">
    <title>Progress - StudyPilot</title>
</head>

<body>
    <div class="parent-ctn flex">
        <aside class="sidebar flex column">
            <h2>StudyPilot</h2>

            <div class="profile flex">
                <div class="profile-img-ctn">
                    <img id="profile-image" src="" alt="">
                </div>

                <div class="user-info flex column">
                    <span id="username">John Doe</span>
                    <span id="department">Computer Science</span>
                </div>
            </div>

            <div class="nav flex column">
                    <a href="dashboard.html">
                        <div class="nav-item flex">
                            <img class="home icon" src="icons/home.png" alt="">
                            <span>Dashboard</span>
                        </div>
                    </a>

                    <a href="upload.html">
                        <div class="nav-item flex">
                            <img class="upload icon" src="icons/upload.png" alt="">
                            <span>Upload Syllabus</span>
                        </div>
                    </a>

                    <a href="study-planner.html">
                        <div class="nav-item flex">
                            <img class="calendar-w icon" src="icons/calendar-w.png" alt="">
                            <span>Study Planner</span>
                        </div>
                    </a>

                    <a href="progress.html">
                        <div class="nav-item flex active">
                            <span class="nav-indicator"></span>
                            <img class="bars icon" src="icons/progress.png" alt="">
                            <span>Progress</span>
                        </div>
                    </a>

                    <a href="" class="logout-ctn">
                        <div class="nav-item flex">
                            <img class="logout icon" src="icons/logout.png" alt="">
                            <span id="logout-btn">Logout</span>
                        </div>
                    </a>
            </div>
        </aside>

        <div class="main flex column">
            <div class="courses-ctn container flex">
                <div class="courses card flex column">
                    <h3 class="course-title">CSC 211</h3>

                    <div class="progress-ctn flex">
                        <div class="progress">
                            <div class="progress-bar" data-progress-value="75%"></div>
                        </div>
                        <h3 class="progress-value">75%</h3>
                    </div>
                </div>

                <div class="courses card flex column">
                    <h3 class="course-title">CSC 213</h3>

                    <div class="progress-ctn flex">
                        <div class="progress">
                            <div class="progress-bar" data-progress-value="45%"></div>
                        </div>
                        <h3 class="progress-value">45%</h3>
                    </div>
                </div>

                <div class="courses card flex column">
                    <h3 class="course-title">CSC 212</h3>

                    <div class="progress-ctn flex">
                        <div class="progress">
                            <div class="progress-bar" data-progress-value="60%"></div>
                        </div>
                        <h3 class="progress-value">60%</h3>
                    </div>
                </div>
            </div>

            <div class="progress-analytics container">
                <h3>Progress Analytics</h3>
                <div id="progress-analytics-chart-ctn"></div>
            </div>
        </div>
    </div>
</body>
</html>
